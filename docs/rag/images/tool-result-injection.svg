<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="590" viewBox="0 0 1180 590" role="img" aria-labelledby="title desc">
<title id="title">Tool-Result Injection</title>
<desc id="desc">The model calls a live tool, receives the result, and continues with that result in context.</desc>
