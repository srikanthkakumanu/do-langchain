<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="530" viewBox="0 0 1180 530" role="img" aria-labelledby="title desc">
<title id="title">The RAG Pipeline</title>
<desc id="desc">Index documents offline, then retrieve and generate online for each question.</desc>
