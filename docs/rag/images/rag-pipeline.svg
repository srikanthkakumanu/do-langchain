48b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="shadow" x="472" y="178" width="150" height="78" rx="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4" opacity="1"/><rect x="472" y="178" width="150" height="8" rx="4" fill="#0284c7" opacity="0.92"/><text x="547.0" y="223" text-anchor="middle" font-size="20" font-weight="800" fill="#172033"><tspan x="547.0" dy="0">Split</tspan></text><text x="547.0" y="264" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b"><tspan x="547.0" dy="0">Chunks + metadata</tspan></text><line x1="622" y1="217" x2="656" y2="217" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="shadow" x="662" y="178" width="150" height="78" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4" opacity="1"/><rect x="662" y="178" width="150" height="8" rx="4" fill="#7c3aed" opacity="0.92"/><text x="737.0" y="223" text-anchor="middle" font-size="20" font-weight="800" fill="#172033"><tspan x="737.0" dy="0">Embed</tspan></text><text x="737.0" y="264" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b"><tspan x="737.0" dy="0">Chunk vectors</tspan></text><line x1="812" y1="217" x2="846" y2="217" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="shadow" x="852" y="178" width="150" height="78" rx="24" fill="#ecfdf5" stroke="#059669" stroke-width="1.4" opacity="1"/><rect x="852" y="178" width="150" height="8" rx="4" fill="#059669" opacity="0.92"/><text x="927.0" y="223" text-anchor="middle" font-size="20" font-weight="800" fill="#172033"><tspan x="927.0" dy="0">Store</tspan></text><text x="927.0" y="264" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b"><tspan x="927.0" dy="0">Vector index</tspan></text><rect class="shadow" x="92" y="373" width="150" height="78" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.4" opacity="1"/><rect x="92" y="373" width="150" height="8" 