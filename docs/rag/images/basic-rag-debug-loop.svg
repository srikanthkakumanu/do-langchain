<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
<title id="title">Basic RAG Debug Loop</title>
<desc id="desc">Separate retrieval failures from generation failures before tuning the system.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fbff"/>
    <stop offset="0.45" stop-color="#f6f0ff"/>
    <stop offset="1" stop-color="#effdf5"/>
  </linearGradient>
  <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#60a5fa" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#f472b6" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
  </radialGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
  </marker>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .shadow { filter: url(#softShadow); }
  </style>
</defs>
<rect width="100%" height="100%" rx="36" fill="url(#bg)"/>
<circle cx="1100" cy="80" r="135" fill="url(#glowBlue)"/>
<circle cx="95" cy="570" r="150" fill="url(#glowPink)"/>
<text x="44" y="50" text-anchor="start" font-size="28" font-weight="900" fill="#111827"><tspan x="44" dy="0">Basic RAG Debug Loop</tspan></text>
<text x="44" y="86" text-anchor="start" font-size="15" font-weight="560" fill="#64748b"><tspan x="44" dy="0">Separate retrieval failures from generation failures before tuning the system.</tspan></text>

<rect class="shadow" x="80" y="210" width="190" height="110" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="80" y="210" width="190" height="9" rx="4.5" fill="#f59e0b"/>
<text x="175.0" y="260" text-anchor="middle" font-size="21" font-weight="850" fill="#111827"><tspan x="175.0" dy="0">Ask test question</tspan></text>
<text x="175.0" y="301" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="175.0" dy="0">start with one case</tspan></text>

<rect class="shadow" x="335" y="210" width="210" height="110" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="335" y="210" width="210" height="9" rx="4.5" fill="#06b6d4"/>
<text x="440.0" y="260" text-anchor="middle" font-size="21" font-weight="850" fill="#111827"><tspan x="440.0" dy="0">Print retrieved</tspan><tspan x="440.0" dy="22">chunks</tspan></text>
<text x="440.0" y="301" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="440.0" dy="0">inspect evidence</tspan><tspan x="440.0" dy="18">first</tspan></text>

<rect class="shadow" x="615" y="190" width="210" height="150" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="615" y="190" width="210" height="9" rx="4.5" fill="#ec4899"/>
<text x="720.0" y="240" text-anchor="middle" font-size="21" font-weight="850" fill="#111827"><tspan x="720.0" dy="0">Answer present?</tspan></text>
<text x="720.0" y="281" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="720.0" dy="0">retrieval check</tspan></text>

<rect class="shadow" x="900" y="95" width="220" height="110" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="900" y="95" width="220" height="9" rx="4.5" fill="#ef4444"/>
<text x="1010.0" y="145" text-anchor="middle" font-size="21" font-weight="850" fill="#111827"><tspan x="1010.0" dy="0">Retrieval issue</tspan></text>
<text x="1010.0" y="186" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="1010.0" dy="0">tune chunking, k,</tspan><tspan x="1010.0" dy="18">embeddings</tspan></text>

<rect class="shadow" x="900" y="295" width="220" height="110" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="900" y="295" width="220" height="9" rx="4.5" fill="#8b5cf6"/>
<text x="1010.0" y="345" text-anchor="middle" font-size="21" font-weight="850" fill="#111827"><tspan x="1010.0" dy="0">Generation issue</tspan></text>
<text x="1010.0" y="386" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="1010.0" dy="0">tune prompt or model</tspan></text>

<rect class="shadow" x="900" y="480" width="220" height="90" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="900" y="480" width="220" height="9" rx="4.5" fill="#10b981"/>
<text x="1010.0" y="530" text-anchor="middle" font-size="21" font-weight="850" fill="#111827"><tspan x="1010.0" dy="0">Pass</tspan></text>
<text x="1010.0" y="571" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="1010.0" dy="0">grounded answer</tspan></text>
<line x1="270" y1="265" x2="335" y2="265" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="545" y1="265" x2="615" y2="265" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M825 230 C 862.5 230, 862.5 150, 900 150" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="774.5" y="172.0" width="176" height="32" rx="16.0" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="862.5" y="194.0" text-anchor="middle" font-size="15" font-weight="800" fill="#64748b"><tspan x="862.5" dy="0">no</tspan></text><path d="M825 265 C 862.5 265, 862.5 350, 900 350" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="774.5" y="289.5" width="176" height="32" rx="16.0" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="862.5" y="311.5" text-anchor="middle" font-size="15" font-weight="800" fill="#64748b"><tspan x="862.5" dy="0">yes, but wrong</tspan></text><path d="M825 300 C 862.5 300, 862.5 525, 900 525" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="774.5" y="394.5" width="176" height="32" rx="16.0" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="862.5" y="416.5" text-anchor="middle" font-size="15" font-weight="800" fill="#64748b"><tspan x="862.5" dy="0">yes and faithful</tspan></text><rect x="305" y="450" width="420" height="42" rx="21.0" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="515.0" y="477.0" text-anchor="middle" font-size="15" font-weight="800" fill="#2563eb"><tspan x="515.0" dy="0">Debug retrieval before changing the LLM</tspan></text>
</svg>
