<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc">
<title id="title">RAG at a Glance</title>
<desc id="desc">A question becomes a grounded answer by adding retrieved context before generation.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fbff"/>
    <stop offset="0.52" stop-color="#f7f3ff"/>
    <stop offset="1" stop-color="#eefdf8"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.13"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
  </marker>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .shadow { filter: url(#softShadow); }
  </style>
</defs>
<rect width="100%" height="100%" rx="34" fill="url(#bg)"/>
<circle cx="1090" cy="78" r="92" fill="#38bdf8" opacity="0.10"/>
<circle cx="96" cy="284" r="118" fill="#a78bfa" opacity="0.10"/>
<text x="44" y="48" text-anchor="start" font-size="26" font-weight="850" fill="#172033"><tspan x="44" dy="0">RAG at a Glance</tspan></text>
<text x="44" y="82" text-anchor="start" font-size="15" font-weight="520" fill="#64748b"><tspan x="44" dy="0">A question becomes a grounded answer by adding retrieved context before generation.</tspan></text>
<rect class="shadow" x="70" y="145" width="170" height="150" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.4" opacity="1"/><rect x="70" y="145" width="170" height="8" rx="4" fill="1" opacity="0.92"/><text x="155.0" y="190" text-anchor="middle" font-size="20" font-weight="800" fill="#172033"><tspan x="155.0" dy="0">Question</tspan></text><text x="155.0" y="231" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b"><tspan x="155.0" dy="0">What does the user</tspan><tspan x="155.0" dy="18">need?</tspan></text><rect class="shadow" x="285" y="145" width="170" height="150" rx="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4" opacity="1"/><rect x="285" y="145" width="170" height="8" rx="4" fill="2" opacity="0.92"/><text x="370.0" y="190" text-anchor="middle" font-size="20" font-weight="800" fill="#172033"><tspan x="370.0" dy="0">Retrieve</tspan></text><text x="370.0" y="231" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b"><tspan x="370.0" dy="0">Find relevant</tspan><tspan x="370.0" dy="18">chunks</tspan></text><rect class="shadow" x="500" y="145" width="170" height="150" rx="24" fill="#ecfdf5" stroke="#059669" stroke-width="1.4" opacity="1"/><rect x="500" y="145" width="170" height="8" rx="4" fill="3" opacity="0.92"/><text x="585.0" y="190" text-anchor="middle" font-size="20" font-weight="800" fill="#172033"><tspan x="585.0" dy="0">Context</tspan></text><text x="585.0" y="231" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b"><tspan x="585.0" dy="0">Source text enters</tspan><tspan x="585.0" dy="18">prompt</tspan></text><rect class="shadow" x="715" y="145" width="170" height="150" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4" opacity="1"/><rect x="715" y="145" width="170" height="8" rx="4" fill="4" opacity="0.92"/><text x="800.0" y="190" text-anchor="middle" font-size="20" font-weight="800" fill="#172033"><tspan x="800.0" dy="0">LLM</tspan></text><text x="800.0" y="231" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b"><tspan x="800.0" dy="0">Reason and write</tspan></text><rect class="shadow" x="930" y="145" width="170" height="150" rx="24" fill="#fce7f3" stroke="#db2777" stroke-width="1.4" opacity="1"/><rect x="930" y="145" width="170" height="8" rx="4" fill="5" opacity="0.92"/><text x="1015.0" y="190" text-anchor="middle" font-size="20" font-weight="800" fill="#172033"><tspan x="1015.0" dy="0">Answer</tspan></text><text x="1015.0" y="231" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b"><tspan x="1015.0" dy="0">Grounded response</tspan></text><line x1="240" y1="220" x2="275" y2="220" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="455" y1="220" x2="490" y2="220" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="670" y1="220" x2="705" y2="220" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="885" y1="220" x2="920" y2="220" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>