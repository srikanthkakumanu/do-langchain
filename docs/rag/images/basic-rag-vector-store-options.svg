<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
<title id="title">Vector Store Options</title>
<desc id="desc">The example runs in memory by default and can switch to Chroma when persistence is useful.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fbff"/>
    <stop offset="0.45" stop-color="#f6f0ff"/>
    <stop offset="1" stop-color="#effdf5"/>
  </linearGradient>
  <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#60a5fa" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#f472b6" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
  </radialGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
  </marker>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .shadow { filter: url(#softShadow); }
  </style>
</defs>
<rect width="100%" height="100%" rx="36" fill="url(#bg)"/>
<circle cx="1100" cy="80" r="135" fill="url(#glowBlue)"/>
<circle cx="95" cy="540" r="150" fill="url(#glowPink)"/>
<text x="44" y="50" text-anchor="start" font-size="28" font-weight="900" fill="#111827"><tspan x="44" dy="0">Vector Store Options</tspan></text>
<text x="44" y="86" text-anchor="start" font-size="15" font-weight="560" fill="#64748b"><tspan x="44" dy="0">The example runs in memory by default and can switch to Chroma when persistence is useful.</tspan></text>

<rect class="shadow" x="80" y="185" width="210" height="120" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="80" y="185" width="210" height="9" rx="4.5" fill="#8b5cf6"/>
<text x="185.0" y="235" text-anchor="middle" font-size="21" font-weight="850" fill="#111827"><tspan x="185.0" dy="0">Chunks + vectors</tspan></text>
<text x="185.0" y="276" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="185.0" dy="0">same input for both</tspan><tspan x="185.0" dy="18">stores</tspan></text>

<rect class="shadow" x="440" y="110" width="250" height="140" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="440" y="110" width="250" height="9" rx="4.5" fill="#06b6d4"/>
<text x="565.0" y="160" text-anchor="middle" font-size="21" font-weight="850" fill="#111827"><tspan x="565.0" dy="0">InMemoryVectorStore</tspan></text>
<text x="565.0" y="201" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="565.0" dy="0">zero setup, rebuilt</tspan><tspan x="565.0" dy="18">every run</tspan></text>

<rect class="shadow" x="440" y="330" width="250" height="140" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="440" y="330" width="250" height="9" rx="4.5" fill="#10b981"/>
<text x="565.0" y="380" text-anchor="middle" font-size="21" font-weight="850" fill="#111827"><tspan x="565.0" dy="0">Chroma</tspan></text>
<text x="565.0" y="421" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="565.0" dy="0">persistent local</tspan><tspan x="565.0" dy="18">vector DB</tspan></text>

<rect class="shadow" x="850" y="220" width="230" height="140" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="850" y="220" width="230" height="9" rx="4.5" fill="#2563eb"/>
<text x="965.0" y="270" text-anchor="middle" font-size="21" font-weight="850" fill="#111827"><tspan x="965.0" dy="0">Retriever</tspan></text>
<text x="965.0" y="311" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="965.0" dy="0">same retriever API</tspan></text>
<line x1="290" y1="245" x2="440" y2="180" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="289.0" y="195.5" width="152" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/><text x="365.0" y="217.5" text-anchor="middle" font-size="13" font-weight="750" fill="#64748b"><tspan x="365.0" dy="0">default</tspan></text><line x1="290" y1="245" x2="440" y2="400" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="289.0" y="305.5" width="152" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/><text x="365.0" y="327.5" text-anchor="middle" font-size="13" font-weight="750" fill="#64748b"><tspan x="365.0" dy="0">optional</tspan></text><line x1="690" y1="180" x2="850" y2="275" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="690" y1="400" x2="850" y2="305" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="395" y="515" width="385" height="40" rx="20.0" fill="#ffffff" stroke="#111827" stroke-width="1.5"/><text x="587.5" y="541.0" text-anchor="middle" font-size="15" font-weight="800" fill="#111827"><tspan x="587.5" dy="0">BASIC_RAG_VECTOR_STORE=memory or chroma</tspan></text><rect x="805" y="515" width="255" height="40" rx="20.0" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/><text x="932.5" y="541.0" text-anchor="middle" font-size="15" font-weight="800" fill="#10b981"><tspan x="932.5" dy="0">Install langchain-chroma</tspan></text>
</svg>
