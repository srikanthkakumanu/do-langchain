<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-labelledby="title desc">
<title id="title">Basic RAG Workflow</title>
<desc id="desc">The complete naive RAG path from source file to grounded answer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fbff"/>
    <stop offset="0.45" stop-color="#f6f0ff"/>
    <stop offset="1" stop-color="#effdf5"/>
  </linearGradient>
  <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#60a5fa" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#f472b6" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
  </radialGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
  </marker>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .shadow { filter: url(#softShadow); }
  </style>
</defs>
<rect width="100%" height="100%" rx="36" fill="url(#bg)"/>
<circle cx="1100" cy="80" r="135" fill="url(#glowBlue)"/>
<circle cx="95" cy="340" r="150" fill="url(#glowPink)"/>
<text x="44" y="50" text-anchor="start" font-size="28" font-weight="900" fill="#111827"><tspan x="44" dy="0">Basic RAG Workflow</tspan></text>
<text x="44" y="86" text-anchor="start" font-size="15" font-weight="560" fill="#64748b"><tspan x="44" dy="0">The complete naive RAG path from source file to grounded answer.</tspan></text>

<rect class="shadow" x="54" y="160" width="130" height="118" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="54" y="160" width="130" height="9" rx="4.5" fill="#f59e0b"/>
<text x="119.0" y="210" text-anchor="middle" font-size="21" font-weight="850" fill="#111827"><tspan x="119.0" dy="0">Load</tspan></text>
<text x="119.0" y="251" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="119.0" dy="0">file to Document</tspan></text>
<circle cx="76" cy="295" r="15" fill="#f59e0b" opacity="0.16"/><text x="76" y="300" text-anchor="middle" font-size="13" font-weight="850" fill="#f59e0b">1</text><line x1="184" y1="219" x2="210" y2="219" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect class="shadow" x="212" y="160" width="130" height="118" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="212" y="160" width="130" height="9" rx="4.5" fill="#06b6d4"/>
<text x="277.0" y="210" text-anchor="middle" font-size="21" font-weight="850" fill="#111827"><tspan x="277.0" dy="0">Split</tspan></text>
<text x="277.0" y="251" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="277.0" dy="0">Document to</tspan><tspan x="277.0" dy="18">chunks</tspan></text>
<circle cx="234" cy="295" r="15" fill="#06b6d4" opacity="0.16"/><text x="234" y="300" text-anchor="middle" font-size="13" font-weight="850" fill="#06b6d4">2</text><line x1="342" y1="219" x2="368" y2="219" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect class="shadow" x="370" y="160" width="130" height="118" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="370" y="160" width="130" height="9" rx="4.5" fill="#8b5cf6"/>
<text x="435.0" y="210" text-anchor="middle" font-size="21" font-weight="850" fill="#111827"><tspan x="435.0" dy="0">Embed</tspan></text>
<text x="435.0" y="251" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="435.0" dy="0">text to vectors</tspan></text>
<circle cx="392" cy="295" r="15" fill="#8b5cf6" opacity="0.16"/><text x="392" y="300" text-anchor="middle" font-size="13" font-weight="850" fill="#8b5cf6">3</text><line x1="500" y1="219" x2="526" y2="219" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect class="shadow" x="528" y="160" width="130" height="118" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="528" y="160" width="130" height="9" rx="4.5" fill="#10b981"/>
<text x="593.0" y="210" text-anchor="middle" font-size="21" font-weight="850" fill="#111827"><tspan x="593.0" dy="0">Store</tspan></text>
<text x="593.0" y="251" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="593.0" dy="0">index vectors</tspan></text>
<circle cx="550" cy="295" r="15" fill="#10b981" opacity="0.16"/><text x="550" y="300" text-anchor="middle" font-size="13" font-weight="850" fill="#10b981">4</text><line x1="658" y1="219" x2="684" y2="219" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect class="shadow" x="686" y="160" width="130" height="118" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="686" y="160" width="130" height="9" rx="4.5" fill="#2563eb"/>
<text x="751.0" y="210" text-anchor="middle" font-size="21" font-weight="850" fill="#111827"><tspan x="751.0" dy="0">Retrieve</tspan></text>
<text x="751.0" y="251" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="751.0" dy="0">top k chunks</tspan></text>
<circle cx="708" cy="295" r="15" fill="#2563eb" opacity="0.16"/><text x="708" y="300" text-anchor="middle" font-size="13" font-weight="850" fill="#2563eb">5</text><line x1="816" y1="219" x2="842" y2="219" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect class="shadow" x="844" y="160" width="130" height="118" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="844" y="160" width="130" height="9" rx="4.5" fill="#ec4899"/>
<text x="909.0" y="210" text-anchor="middle" font-size="21" font-weight="850" fill="#111827"><tspan x="909.0" dy="0">Augment</tspan></text>
<text x="909.0" y="251" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="909.0" dy="0">context +</tspan><tspan x="909.0" dy="18">question</tspan></text>
<circle cx="866" cy="295" r="15" fill="#ec4899" opacity="0.16"/><text x="866" y="300" text-anchor="middle" font-size="13" font-weight="850" fill="#ec4899">6</text><line x1="974" y1="219" x2="1000" y2="219" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect class="shadow" x="1002" y="160" width="130" height="118" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="1002" y="160" width="130" height="9" rx="4.5" fill="#111827"/>
<text x="1067.0" y="210" text-anchor="middle" font-size="21" font-weight="850" fill="#111827"><tspan x="1067.0" dy="0">Generate</tspan></text>
<text x="1067.0" y="251" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="1067.0" dy="0">grounded answer</tspan></text>
<circle cx="1024" cy="295" r="15" fill="#111827" opacity="0.16"/><text x="1024" y="300" text-anchor="middle" font-size="13" font-weight="850" fill="#111827">7</text><rect x="410" y="332" width="360" height="42" rx="21.0" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="590.0" y="359.0" text-anchor="middle" font-size="15" font-weight="800" fill="#2563eb"><tspan x="590.0" dy="0">One retrieval pass, one generation call</tspan></text>
</svg>
