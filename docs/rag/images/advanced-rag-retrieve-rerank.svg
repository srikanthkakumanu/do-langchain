<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" role="img" aria-labelledby="title desc">
<title id="title">Retrieve and Rerank</title>
<desc id="desc">Advanced RAG improves the evidence before it reaches the final answer prompt.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fbff"/>
    <stop offset="0.48" stop-color="#f7f0ff"/>
    <stop offset="1" stop-color="#effdf7"/>
  </linearGradient>
  <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#60a5fa" stop-opacity="0.26"/>
    <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#f472b6" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
  </radialGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
  </marker>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .shadow { filter: url(#softShadow); }
  </style>
</defs>
<rect width="100%" height="100%" rx="36" fill="url(#bg)"/>
<circle cx="1090" cy="80" r="135" fill="url(#blueGlow)"/>
<circle cx="100" cy="515" r="155" fill="url(#pinkGlow)"/>
<text x="44" y="50" text-anchor="start" font-size="28" font-weight="900" fill="#111827"><tspan x="44" dy="0">Retrieve and Rerank</tspan></text>
<text x="44" y="86" text-anchor="start" font-size="15" font-weight="560" fill="#64748b"><tspan x="44" dy="0">Advanced RAG improves the evidence before it reaches the final answer prompt.</tspan></text>

<rect class="shadow" x="60" y="215" width="170" height="110" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="60" y="215" width="170" height="9" rx="4.5" fill="#f59e0b"/>
<text x="145.0" y="263" text-anchor="middle" font-size="20" font-weight="850" fill="#111827"><tspan x="145.0" dy="0">Question</tspan></text>
<text x="145.0" y="301" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="145.0" dy="0">user input</tspan></text>

<rect class="shadow" x="290" y="125" width="190" height="110" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="290" y="125" width="190" height="9" rx="4.5" fill="#06b6d4"/>
<text x="385.0" y="173" text-anchor="middle" font-size="20" font-weight="850" fill="#111827"><tspan x="385.0" dy="0">Query Rewrite</tspan></text>
<text x="385.0" y="211" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="385.0" dy="0">semantic search query</tspan></text>

<rect class="shadow" x="290" y="320" width="190" height="110" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="290" y="320" width="190" height="9" rx="4.5" fill="#8b5cf6"/>
<text x="385.0" y="368" text-anchor="middle" font-size="20" font-weight="850" fill="#111827"><tspan x="385.0" dy="0">Query Embed</tspan></text>
<text x="385.0" y="406" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="385.0" dy="0">same vector space</tspan></text>

<rect class="shadow" x="565" y="215" width="205" height="120" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="565" y="215" width="205" height="9" rx="4.5" fill="#10b981"/>
<text x="667.5" y="263" text-anchor="middle" font-size="20" font-weight="850" fill="#111827"><tspan x="667.5" dy="0">Pinecone Search</tspan></text>
<text x="667.5" y="301" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="667.5" dy="0">filter + top k +</tspan><tspan x="667.5" dy="18">scores</tspan></text>

<rect class="shadow" x="840" y="125" width="210" height="110" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="840" y="125" width="210" height="9" rx="4.5" fill="#ec4899"/>
<text x="945.0" y="173" text-anchor="middle" font-size="20" font-weight="850" fill="#111827"><tspan x="945.0" dy="0">Rerank</tspan></text>
<text x="945.0" y="211" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="945.0" dy="0">score + lexical</tspan><tspan x="945.0" dy="18">overlap</tspan></text>

<rect class="shadow" x="840" y="320" width="210" height="110" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="840" y="320" width="210" height="9" rx="4.5" fill="#2563eb"/>
<text x="945.0" y="368" text-anchor="middle" font-size="20" font-weight="850" fill="#111827"><tspan x="945.0" dy="0">Evidence</tspan></text>
<text x="945.0" y="406" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="945.0" dy="0">best chunks only</tspan></text>
<line x1="230" y1="270" x2="290" y2="180" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="230" y1="270" x2="290" y2="375" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="480" y1="180" x2="565" y2="245" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="480" y1="375" x2="565" y2="300" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="770" y1="275" x2="840" y2="180" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="945" y1="235" x2="945" y2="320" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="383" y="500" width="435" height="42" rx="21.0" fill="#ffffff" stroke="#111827" stroke-width="1.5"/><text x="600.5" y="527.0" text-anchor="middle" font-size="15" font-weight="820" fill="#111827"><tspan x="600.5" dy="0">Retrieve more candidates, then keep</tspan><tspan x="600.5" dy="22">better evidence</tspan></text>
</svg>