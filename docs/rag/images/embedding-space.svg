<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
<title id="title">Conceptual Embedding Space</title>
<desc id="desc">A simplified two-dimensional view of how semantic similarity becomes searchable geometry.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fbff"/>
    <stop offset="0.52" stop-color="#f7f3ff"/>
    <stop offset="1" stop-color="#eefdf8"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.13"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
  </marker>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .shadow { filter: url(#softShadow); }
  </style>
</defs>
<rect width="100%" height="100%" rx="34" fill="url(#bg)"/>
<circle cx="1090" cy="78" r="92" fill="#38bdf8" opacity="0.10"/>
<circle cx="96" cy="544" r="118" fill="#a78bfa" opacity="0.10"/>
<text x="44" y="48" text-anchor="start" font-size="26" font-weight="850" fill="#172033"><tspan x="44" dy="0">Conceptual Embedding Space</tspan></text>
<text x="44" y="82" text-anchor="start" font-size="15" font-weight="520" fill="#64748b"><tspan x="44" dy="0">A simplified two-dimensional view of how semantic similarity becomes searchable geometry.</tspan></text>
<rect class="" x="105" y="125" width="780" height="430" rx="24" fill="#ffffffcc" stroke="#dbe3ef" stroke-width="1.5" opacity="1"/><line x1="495" y1="145" x2="495" y2="535" stroke="#cbd5e1" stroke-width="2"/><line x1="125" y1="340" x2="865" y2="340" stroke="#cbd5e1" stroke-width="2"/><text x="145" y="168" text-anchor="start" font-size="18" font-weight="800" fill="#475569"><tspan x="145" dy="0">Unrelated</tspan></text><text x="710" y="168" text-anchor="start" font-size="18" font-weight="800" fill="#047857"><tspan x="710" dy="0">Animal-like</tspan></text><text x="145" y="520" text-anchor="start" font-size="18" font-weight="800" fill="#9a3412"><tspan x="145" dy="0">Vehicle-like</tspan></text><text x="705" y="520" text-anchor="start" font-size="18" font-weight="800" fill="#1d4ed8"><tspan x="705" dy="0">Mixed meaning</tspan></text><circle cx="735" cy="205" r="10" fill="#059669"/><text x="751" y="210" font-size="15" font-weight="700" fill="#172033">cat</text><circle cx="705" cy="238" r="10" fill="#059669"/><text x="721" y="243" font-size="15" font-weight="700" fill="#172033">kitten</text><circle cx="680" cy="270" r="10" fill="#059669"/><text x="696" y="275" font-size="15" font-weight="700" fill="#172033">dog</text><circle cx="235" cy="472" r="10" fill="#ea580c"/><text x="251" y="477" font-size="15" font-weight="700" fill="#172033">car</text><circle cx="280" cy="442" r="10" fill="#ea580c"/><text x="296" y="447" font-size="15" font-weight="700" fill="#172033">truck</text><circle cx="350" cy="410" r="10" fill="#ea580c"/><text x="366" y="415" font-size="15" font-weight="700" fill="#172033">electric vehicle</text><rect class="shadow" x="930" y="180" width="190" height="250" rx="24" fill="#ffffff" stroke="#dbe3ef" stroke-width="1.4" opacity="1"/><rect x="930" y="180" width="190" height="8" rx="4" fill="#2563eb" opacity="0.92"/><text x="1025.0" y="225" text-anchor="middle" font-size="20" font-weight="800" fill="#172033"><tspan x="1025.0" dy="0">Key idea</tspan></text><text x="1025.0" y="266" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b"><tspan x="1025.0" dy="0">Similar meanings land</tspan><tspan x="1025.0" dy="18">close together.</tspan><tspan x="1025.0" dy="18">Retrieval searches</tspan><tspan x="1025.0" dy="18">nearby points, not just</tspan><tspan x="1025.0" dy="18">exact words.</tspan></text>
</svg>