<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="440" viewBox="0 0 1180 440" role="img" aria-labelledby="title desc">
<title id="title">Advanced RAG Workflow</title>
<desc id="desc">Query rewriting, Pinecone retrieval, reranking, and grounded generation in one pipeline.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fbff"/>
    <stop offset="0.48" stop-color="#f7f0ff"/>
    <stop offset="1" stop-color="#effdf7"/>
  </linearGradient>
  <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
