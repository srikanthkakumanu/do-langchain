y="0">Vectors + text +</tspan><tspan x="690.0" dy="18">metadata</tspan></text><rect class="shadow" x="880" y="190" width="210" height="130" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4" opacity="1"/><rect x="880" y="190" width="210" height="8" rx="4" fill="#7c3aed" opacity="0.92"/><text x="985.0" y="235" text-anchor="middle" font-size="20" font-weight="800" fill="#172033"><tspan x="985.0" dy="0">Nearest search</tspan></text><text x="985.0" y="276" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b"><tspan x="985.0" dy="0">Find matching chunks</tspan><tspan x="985.0" dy="18">fast</tspan></text><line x1="260" y1="230" x2="340" y2="205" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="260" y1="260" x2="340" y2="340" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="520" y1="205" x2="600" y2="230" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="520" y1="340" x2="600" y2="280" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="780" y1="255" x2="880" y2="255" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
