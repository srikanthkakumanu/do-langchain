<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" role="img" aria-labelledby="title desc">
<title id="title">What a Vector Store Keeps</title>
<desc id="desc">Each chunk is stored with its vector and metadata so retrieval can return useful source documents.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fbff"/>
    <stop offset="0.52" stop-color="#f7f3ff"/>
    <stop offset="1" stop-color="#eefdf8"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.13"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
  </marker>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .shadow { filter: url(#softShadow); }
  </style>
</defs>
<rect width="100%" height="100%" rx="34" fill="url(#bg)"/>
<circle cx="1090" cy="78" r="92" fill="#38bdf8" opacity="0.10"/>
<circle cx="96" cy="394" r="118" fill="#a78bfa" opacity="0.10"/>
<text x="44" y="48" text-anchor="start" font-size="26" font-weight="850" fill="#172033"><tspan x="44" dy="0">What a Vector Store Keeps</tspan></text>
<text x="44" y="82" text-anchor="start" font-size="15" font-weight="520" fill="#64748b"><tspan x="44" dy="0">Each chunk is stored with its vector and metadata so retrieval can return useful source</tspan><tspan x="44" dy="20">documents.</tspan></text>
