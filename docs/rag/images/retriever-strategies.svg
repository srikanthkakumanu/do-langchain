<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
<title id="title">Retriever Strategies</title>
<desc id="desc">A retriever embeds the question, fetches candidates, then returns the best context chunks.</desc>
<defs>
