<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" role="img" aria-labelledby="title desc">
<title id="title">LCEL RAG Chain Flow</title>
<desc id="desc">The chain computes context, fills a grounded prompt, calls the model, and returns a string answer.</desc>
