<text x="440.0" y="378" text-anchor="middle" font-size="20" font-weight="850" fill="#111827"><tspan x="440.0" dy="0">Record IDs</tspan></text>
<text x="440.0" y="416" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="440.0" dy="0">stable chunk ids</tspan></text>

<rect class="shadow" x="650" y="155" width="220" height="125" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="650" y="155" width="220" height="9" rx="4.5" fill="#10b981"/>
