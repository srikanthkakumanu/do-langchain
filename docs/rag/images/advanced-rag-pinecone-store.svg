<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
<title id="title">Store Vectors in Pinecone</title>
<desc id="desc">The example creates or reuses a Pinecone index and upserts chunk vectors with metadata.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fbff"/>
    <stop offset="0.48" stop-color="#f7f0ff"/>
    <stop offset="1" stop-color="#effdf7"/>
  </linearGradient>
  <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#60a5fa" stop-opacity="0.26"/>
    <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#f472b6" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
  </radialGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
  </marker>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .shadow { filter: url(#softShadow); }
  </style>
</defs>
<rect width="100%" height="100%" rx="36" fill="url(#bg)"/>
<circle cx="1090" cy="80" r="135" fill="url(#blueGlow)"/>
<circle cx="100" cy="535" r="155" fill="url(#pinkGlow)"/>
<text x="44" y="50" text-anchor="start" font-size="28" font-weight="900" fill="#111827"><tspan x="44" dy="0">Store Vectors in Pinecone</tspan></text>
<text x="44" y="86" text-anchor="start" font-size="15" font-weight="560" fill="#64748b"><tspan x="44" dy="0">The example creates or reuses a Pinecone index and upserts chunk vectors with metadata.</tspan></text>

<rect class="shadow" x="70" y="205" width="190" height="110" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
