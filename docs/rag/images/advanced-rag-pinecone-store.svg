<text x="760.0" y="241" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="760.0" dy="0">dimension 384, cosine</tspan></text>

<rect class="shadow" x="650" y="340" width="220" height="105" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
