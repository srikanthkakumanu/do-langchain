<text x="760.0" y="426" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="760.0" dy="0">advanced-rag-demo</tspan></text>

<rect class="shadow" x="950" y="235" width="170" height="115" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="950" y="235" width="170" height="9" rx="4.5" fill="#ec4899"/>
<text x="1035.0" y="283" text-anchor="middle" font-size="20" font-weight="850" fill="#111827"><tspan x="1035.0" dy="0">Upsert</tspan></text>
<text x="1035.0" y="321" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="1035.0" dy="0">vectors + metadata</tspan></text>
