<text x="165.0" y="253" text-anchor="middle" font-size="20" font-weight="850" fill="#111827"><tspan x="165.0" dy="0">Chunks</tspan></text>
<text x="165.0" y="291" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="165.0" dy="0">text + metadata</tspan></text>

<rect class="shadow" x="335" y="150" width="210" height="110" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<rect x="335" y="150" width="210" height="9" rx="4.5" fill="#8b5cf6"/>
<text x="440.0" y="198" text-anchor="middle" font-size="20" font-weight="850" fill="#111827"><tspan x="440.0" dy="0">HashingEmbeddings</tspan></text>
<text x="440.0" y="236" text-anchor="middle" font-size="14" font-weight="560" fill="#64748b"><tspan x="440.0" dy="0">tokens to vectors</tspan></text>

<rect class="shadow" x="335" y="330" width="210" height="110" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
