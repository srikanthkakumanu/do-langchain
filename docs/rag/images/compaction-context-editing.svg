<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
<title id="title">Compaction and Context Editing</title>
<desc id="desc">When context gets crowded, prune stale content, summarize useful older content, and keep high-signal detail.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fbff"/>
    <stop offset="0.52" stop-color="#f7f3ff"/>
    <stop offset="1" stop-color="#eefdf8"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.13"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
  </marker>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .shadow { filter: url(#softShadow); }
  </style>
</defs>
<rect width="100%" height="100%" rx="34" fill="url(#bg)"/>
<circle cx="1090" cy="78" r="92" fill="#38bdf8" opacity="0.10"/>
<circle cx="96" cy="484" r="118" fill="#a78bfa" opacity="0.10"/>
<text x="44" y="48" text-anchor="start" font-size="26" font-weight="850" fill="#172033"><tspan x="44" dy="0">Compaction and Context Editing</tspan></text>
<text x="44" y="82" text-anchor="start" font-size="15" font-weight="520" fill="#64748b"><tspan x="44" dy="0">When context gets crowded, prune stale content, summarize useful older content, and keep</tspan><tspan x="44" dy="20">high-signal detail.</tspan></text>
<rect class="shadow" x="80" y="210" width="220" height="100" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.4" opacity="1"/><rect x="80" y="210" width="220" height="8" rx="4" fill="#d97706" opacity="0.92"/><text x="190.0" y="255" text-anchor="middle" font-size="20" font-weight="800" fill="#172033"><tspan x="190.0" dy="0">Context grows</tspan></text><text x="190.0" y="296" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b"><tspan x="190.0" dy="0">messages, chunks, tool</tspan><tspan x="190.0" dy="18">results</tspan></text><rect class="shadow" x="380" y="210" width="180" height="100" rx="24" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4" opacity="1"/><rect x="380" y="210" width="180" height="8" rx="4" fill="#e11d48" opacity="0.92"/><text x="470.0" y="255" text-anchor="middle" font-size="20" font-weight="800" fill="#172033"><tspan x="470.0" dy="0">Past threshold?</tspan></text><text x="470.0" y="296" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b"><tspan x="470.0" dy="0">token budget</tspan></text><rect class="shadow" x="660" y="120" width="180" height="90" rx="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4" opacity="1"/><rect x="660" y="120" width="180" height="8" rx="4" fill="#dc2626" opacity="0.92"/><text x="750.0" y="165" text-anchor="middle" font-size="20" font-weight="800" fill="#172033"><tspan x="750.0" dy="0">Prune</tspan></text><text x="750.0" y="206" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b"><tspan x="750.0" dy="0">drop stale content</tspan></text><rect class="shadow" x="660" y="255" width="180" height="90" rx="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4" opacity="1"/><rect x="660" y="255" width="180" height="8" rx="4" fill="#0284c7" opacity="0.92"/><text x="750.0" y="300" text-anchor="middle" font-size="20" font-weight="800" fill="#172033"><tspan x="750.0" dy="0">Summarize</tspan></text><text x="750.0" y="341" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b"><tspan x="750.0" dy="0">compress old content</tspan></text><rect class="shadow" x="660" y="390" width="180" height="90" rx="24" fill="#ecfdf5" stroke="#059669" stroke-width="1.4" opacity="1"/><rect x="660" y="390" width="180" height="8" rx="4" fill="#059669" opacity="0.92"/><text x="750.0" y="435" text-anchor="middle" font-size="20" font-weight="800" fill="#172033"><tspan x="750.0" dy="0">Keep</tspan></text><text x="750.0" y="476" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b"><tspan x="750.0" dy="0">recent/high signal</tspan></text><rect class="shadow" x="930" y="255" width="190" height="105" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4" opacity="1"/><rect x="930" y="255" width="190" height="8" rx="4" fill="#7c3aed" opacity="0.92"/><text x="1025.0" y="300" text-anchor="middle" font-size="20" font-weight="800" fill="#172033"><tspan x="1025.0" dy="0">Smaller context</tspan></text><text x="1025.0" y="341" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b"><tspan x="1025.0" dy="0">ready for generation</tspan></text><line x1="300" y1="260" x2="380" y2="260" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="560" y1="245" x2="660" y2="165" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="" x="518.0" y="189.0" width="184" height="30" rx="15.0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" opacity="1"/><text x="610.0" y="210.0" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b"><tspan x="610.0" dy="0">stale</tspan></text><line x1="560" y1="260" x2="660" y2="300" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="" x="518.0" y="264.0" width="184" height="30" rx="15.0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" opacity="1"/><text x="610.0" y="285.0" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b"><tspan x="610.0" dy="0">useful</tspan></text><line x1="560" y1="275" x2="660" y2="435" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="" x="518.0" y="339.0" width="184" height="30" rx="15.0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" opacity="1"/><text x="610.0" y="360.0" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b"><tspan x="610.0" dy="0">recent</tspan></text><line x1="840" y1="165" x2="930" y2="307" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="840" y1="300" x2="930" y2="307" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="840" y1="435" x2="930" y2="307" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>